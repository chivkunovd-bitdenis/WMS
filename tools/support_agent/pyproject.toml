[project]
name = "wms-support-agent"
version = "0.1.0"
description = "WMS-639: агент-диспетчер обращений (Telegram, форма «?», Trello, хотфикс по «кати»)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"support_agent/prompts.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
