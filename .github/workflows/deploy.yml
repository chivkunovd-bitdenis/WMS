name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact Git SHA approved for production"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_SHA" in
            ''|*[!0-9a-f]*)
              echo "ERROR: release_sha must be a lowercase full Git SHA" >&2
              exit 64
              ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  build-release-artifact:
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.manifest.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          fetch-depth: 0
      - name: Verify checked out exact SHA
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Run offline release manifest checks
        run: ./scripts/deploy/test-release-manifest.sh
      - name: Build immutable offline release artifact
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
        run: ./scripts/deploy/build-offline-release-artifact.sh --release-sha "$RELEASE_SHA" --output release-artifact
      - id: manifest
        name: Record release manifest digest
        run: echo "artifact_digest=sha256:$(sha256sum release-artifact/release-manifest.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload exact-SHA offline release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wms-release-${{ needs.validate-release.outputs.release_sha }}
          path: release-artifact
          if-no-files-found: error
          compression-level: 0

  deploy:
    needs: [validate-release, build-release-artifact]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download exact-SHA offline release artifact
        uses: actions/download-artifact@v4
        with:
          name: wms-release-${{ needs.validate-release.outputs.release_sha }}
          path: release-artifact
      - name: Transfer verified offline release artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "release-artifact/*"
          target: /tmp/wms-release/${{ needs.validate-release.outputs.release_sha }}
      - name: Deploy verified exact-SHA artifact on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            RELEASE_SHA="${{ needs.validate-release.outputs.release_sha }}"
            case "$RELEASE_SHA" in
              ''|*[!0-9a-f]*)
                echo "ERROR: release_sha must be a lowercase full Git SHA" >&2
                exit 64
                ;;
            esac
            if [ "${#RELEASE_SHA}" -ne 40 ]; then
              echo "ERROR: release_sha must be 40 hex chars" >&2
              exit 64
            fi
            cd "${WMS_REPO_DIR:-/opt/wms}"
            git config --global --add safe.directory "${WMS_REPO_DIR:-/opt/wms}"
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
            git cat-file -e "${RELEASE_SHA}^{commit}"
            git checkout --detach "$RELEASE_SHA"
            WMS_RELEASE_SHA="$RELEASE_SHA" \
            WMS_RELEASE_ARTIFACT_DIR="/tmp/wms-release/$RELEASE_SHA/release-artifact" \
            WMS_RELEASE_MANIFEST="/tmp/wms-release/$RELEASE_SHA/release-artifact/release-manifest.json" \
            ./scripts/deploy/prod-update.sh

      - name: Smoke check exact SHA
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          PORT="${{ secrets.DEPLOY_HTTP_PORT || '8088' }}"
          for path in "/" "/seller/" "/api/health"; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "http://${HOST}:${PORT}${path}" || echo "000")
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done
          version_json="$(curl -fsS "http://${HOST}:${PORT}/api/version")"
          echo "$version_json"
          echo "$version_json" | grep -F "\"git_sha\":\"${{ needs.validate-release.outputs.release_sha }}\""
          echo "$version_json" | grep -F "\"artifact_digest\":\"${{ needs.build-release-artifact.outputs.artifact_digest }}\""
