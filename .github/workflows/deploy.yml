name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact Git SHA approved for production"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on server (git pull + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            RELEASE_SHA="${{ inputs.release_sha }}"
            case "$RELEASE_SHA" in
              ''|*[!0-9a-f]*)
                echo "ERROR: release_sha must be a lowercase full Git SHA" >&2
                exit 64
                ;;
            esac
            if [ "${#RELEASE_SHA}" -ne 40 ]; then
              echo "ERROR: release_sha must be 40 hex chars" >&2
              exit 64
            fi
            cd "${WMS_REPO_DIR:-/opt/wms}"
            git config --global --add safe.directory "${WMS_REPO_DIR:-/opt/wms}"
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
            git cat-file -e "${RELEASE_SHA}^{commit}"
            git checkout --detach "$RELEASE_SHA"
            WMS_RELEASE_SHA="$RELEASE_SHA" ./scripts/deploy/prod-update.sh

      - name: Smoke check exact SHA
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          PORT="${{ secrets.DEPLOY_HTTP_PORT || '8088' }}"
          for path in "/" "/seller/" "/api/health"; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "http://${HOST}:${PORT}${path}" || echo "000")
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done
          version_json="$(curl -fsS "http://${HOST}:${PORT}/api/version")"
          echo "$version_json"
          echo "$version_json" | grep -F "\"git_sha\":\"${{ inputs.release_sha }}\""
