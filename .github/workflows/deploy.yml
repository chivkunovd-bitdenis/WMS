name: Deploy Production

# Manual production deploy only. The server script refuses commits that are
# not already contained in the configured trunk (default: origin/etalon).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on server (trunk guard + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${WMS_REPO_DIR:-/opt/wms}"
            ./scripts/deploy/prod-update.sh

      - name: Smoke check (HTTP 200)
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          PORT="${{ secrets.DEPLOY_HTTP_PORT || '8088' }}"
          for path in "/" "/seller/" "/api/health"; do
            code="000"
            for attempt in $(seq 1 10); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" "http://${HOST}:${PORT}${path}" || true)
              if [ "${code}" = "200" ]; then
                break
              fi
              echo "${path} -> ${code:-000} (attempt ${attempt}/10)"
              if [ "${attempt}" -lt 10 ]; then
                sleep 3
              fi
            done
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done
