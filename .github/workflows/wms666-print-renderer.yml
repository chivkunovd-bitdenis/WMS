name: WMS-666 current-candidate print renderer

on:
  push:
    branches:
      - codex/wms666-print-renderer-ci
    paths:
      - .github/workflows/wms666-print-renderer.yml
  workflow_dispatch:
    inputs:
      application_ref:
        description: Exact 40-character product commit SHA to render and test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wms666-print-renderer-${{ inputs.application_ref }}
  cancel-in-progress: false

jobs:
  current-candidate-renderer:
    name: Linux Chromium and PDF contracts for the requested product SHA
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the requested immutable application SHA
        env:
          APPLICATION_REF: ${{ inputs.application_ref || '5cf6b1a00af251b54c6b653a5e3b0095ccd59df9' }}
        run: |
          [[ "$APPLICATION_REF" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/release-print"

      - name: Check out the exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.application_ref || '5cf6b1a00af251b54c6b653a5e3b0095ccd59df9' }}
          path: application
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install isolated frontend and Linux print-renderer dependencies
        run: |
          npm ci --prefix application/frontend
          npm install --prefix "$RUNNER_TEMP/print-contract-tools" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/print-contract-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          chromium_path="$(node --input-type=module -e "import {chromium} from '$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")"
          echo "WMS672_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
          echo "WMS_PRINT_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"

      - name: Record exact workflow, product, source, and renderer identities
        env:
          APPLICATION_REF: ${{ inputs.application_ref || '5cf6b1a00af251b54c6b653a5e3b0095ccd59df9' }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          application_sha="$(git -C application rev-parse HEAD)"
          test "$application_sha" = "$APPLICATION_REF"
          node --version > "$RUNNER_TEMP/release-print/node-version.txt"
          "$WMS672_CHROMIUM" --version > "$RUNNER_TEMP/release-print/chromium-version.txt"
          pdftotext -v 2> "$RUNNER_TEMP/release-print/poppler-version.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("application")
          paths = [
              "scripts/ci/run_release_print.sh",
              "scripts/ci/wms-print-contract-probe.mjs",
              "frontend/src/screens/v2/fbsPickingListPrint.wms657.test.ts",
              "frontend/src/screens/v2/fbsPickingColor.wms673.dom.test.tsx",
              "frontend/src/screens/v2/fbsPickingColor.wms673.pdf.test.ts",
          ]
          sources = {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in paths}
          manifest = {
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "application_input_ref": os.environ["APPLICATION_REF"],
              "application_checkout_sha": subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip(),
              "source_sha256": sources,
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-print", "identity.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          node -p "require('$RUNNER_TEMP/print-contract-tools/node_modules/playwright/package.json').version" > "$RUNNER_TEMP/release-print/playwright-version.txt"

      - name: Execute the existing WMS-672 / WMS-673 rendered browser and PDF suite
        id: rendered_suite
        continue-on-error: true
        run: bash application/scripts/ci/run_release_print.sh

      - name: Execute WMS-657 real Chromium and PDF layout cases C1-C6
        id: wms657_suite
        if: always()
        continue-on-error: true
        working-directory: application/frontend
        env:
          WMS657_CAPTURE_DIR: ${{ runner.temp }}/release-print/657-rendered
          NODE_OPTIONS: --import=${{ runner.temp }}/release-print/wms657-capture.mjs
        run: |
          cat > "$RUNNER_TEMP/release-print/wms657-capture.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import cp from 'node:child_process';
          import { syncBuiltinESMExports } from 'node:module';
          const capture = process.env.WMS657_CAPTURE_DIR;
          fs.mkdirSync(capture, { recursive: true });
          let sequence = 0;
          const originalRmSync = fs.rmSync.bind(fs);
          fs.rmSync = (target, options) => {
            try {
              const dir = String(target);
              if (/wms657-(geometry|pdf)-/.test(path.basename(dir)) && fs.existsSync(dir)) {
                const out = path.join(capture, `${++sequence}-${path.basename(dir)}`);
                fs.mkdirSync(out, { recursive: true });
                for (const name of fs.readdirSync(dir)) {
                  if (name === 'profile') continue;
                  const source = path.join(dir, name);
                  const stat = fs.statSync(source);
                  if (stat.isFile()) fs.copyFileSync(source, path.join(out, name));
                }
                console.log(`WMS657 rendered evidence captured: ${out}`);
              }
            } catch (error) { console.error('WMS657 evidence capture failed:', error); }
            return originalRmSync(target, options);
          };
          const originalExecFileSync = cp.execFileSync.bind(cp);
          cp.execFileSync = (file, args, options) => {
            const result = originalExecFileSync(file, args, options);
            try {
              const argv = (args ?? []).map(String);
              if (argv.includes('--dump-dom')) {
                const out = path.join(capture, `chromium-dump-${++sequence}.html`);
                fs.writeFileSync(out, result);
                const encoded = String(result).match(/data-wms657-geometry="([A-Za-z0-9+/=]+)"/)?.[1];
                if (encoded) fs.writeFileSync(out.replace(/\.html$/, '.geometry.json'), Buffer.from(encoded, 'base64').toString('utf8'));
                const input = argv.find(item => item.startsWith('file://'));
                if (input) fs.copyFileSync(new URL(input), path.join(capture, `chromium-input-${sequence}.html`));
              }
              if (String(file).endsWith('pdftotext') && argv.includes('-bbox-layout')) {
                fs.writeFileSync(path.join(capture, `pdftotext-${++sequence}.xml`), result);
              }
            } catch (error) { console.error('WMS657 command evidence capture failed:', error); }
            return result;
          };
          syncBuiltinESMExports();
          JS
          set -o pipefail
          npx vitest run src/screens/v2/fbsPickingListPrint.wms657.test.ts \
            --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/release-print/657.json" \
            2>&1 | tee "$RUNNER_TEMP/release-print/657.log"

      - name: Execute WMS-673 real single, group, and packing-screen DOM cases
        id: wms673_dom_suite
        if: always()
        continue-on-error: true
        working-directory: application/frontend
        env:
          WMS673_EVIDENCE_DIR: ${{ runner.temp }}/release-print/673-dom
        run: |
          set -o pipefail
          npx vitest run src/screens/v2/fbsPickingColor.wms673.dom.test.tsx \
            --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/release-print/673-dom.json" \
            2>&1 | tee "$RUNNER_TEMP/release-print/673-dom.log"

      - name: Assert every required renderer case actually executed
        env:
          RENDERED_SUITE_OUTCOME: ${{ steps.rendered_suite.outcome }}
          WMS657_SUITE_OUTCOME: ${{ steps.wms657_suite.outcome }}
          WMS673_DOM_SUITE_OUTCOME: ${{ steps.wms673_dom_suite.outcome }}
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          import os
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-print"
          checks = [("657.json", 6), ("673-dom.json", 19), ("673.json", 5)]
          errors = []
          for name in ("RENDERED_SUITE_OUTCOME", "WMS657_SUITE_OUTCOME", "WMS673_DOM_SUITE_OUTCOME"):
              outcome = os.environ.get(name, "missing")
              print(f"{name}: {outcome}")
              if outcome != "success":
                  errors.append(f"{name}: expected success, got {outcome}")
          for filename, expected in checks:
              path = root / filename
              if not path.exists():
                  errors.append(f"{filename}: missing report")
                  continue
              data = json.loads(path.read_text())
              observed = (data.get("numTotalTests"), data.get("numPassedTests"), data.get("numFailedTests"), data.get("numPendingTests"), data.get("numTodoTests"))
              if not data.get("success") or observed != (expected, expected, 0, 0, 0):
                  errors.append(f"{filename}: expected ({expected}, {expected}, 0, 0, 0), got {observed}")
              else:
                  print(f"{filename}: {expected}/{expected} passed; none skipped or failed")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms666-print-renderer-${{ inputs.application_ref || '5cf6b1a00af251b54c6b653a5e3b0095ccd59df9' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-print
          if-no-files-found: error
          retention-days: 14
