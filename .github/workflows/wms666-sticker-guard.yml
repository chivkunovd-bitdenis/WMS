name: WB packing stickers
on:
  pull_request:
  push:
    branches: [etalon, codex/wms666-sticker-prefetch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packing-stickers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Opening packing must request and display missing stickers in both entry points
        working-directory: frontend
        run: npx vitest run src/screens/v2/FfFbsStickerPrefetch.wms666.dom.test.tsx --maxWorkers=1 --minWorkers=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Request must reach WB and persist a downloadable PNG and visible number
        working-directory: backend
        run: pytest -q tests/test_wms666_packing_sticker_request.py
