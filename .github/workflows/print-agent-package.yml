name: WMS print agent package
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'wms-print-v*'
    paths:
      - 'tools/print-agent/**'
      - '.github/workflows/print-agent-package.yml'
jobs:
  macos-package:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/print-agent -v
      - run: python -m pip install pyinstaller==6.20.0 certifi==2026.2.25
      - run: python tools/print-agent/build_package.py
      - run: tools/print-agent/dist/wms-print/wms-print --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: WMS-Print-macOS
          path: |
            tools/print-agent/dist/WMS-Print-macOS.zip
            tools/print-agent/dist/WMS-Print-macOS.zip.sha256
  windows-package:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - run: choco install nsis --no-progress --yes
      - run: python -m unittest discover -s tools/print-agent -v
      - run: python -m pip install pyinstaller==6.20.0 certifi==2026.2.25 pywin32==311 Pillow==11.3.0 PyMuPDF==1.26.4
      - run: python tools/print-agent/build_package.py
      - run: tools/print-agent/dist/wms-print-setup/wms-print-setup.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: WMS-Print-Windows-x64
          path: |
            tools/print-agent/dist/WMS-Print-Setup-Windows-x64.exe
            tools/print-agent/dist/WMS-Print-Setup-Windows-x64.exe.sha256
  publish-release:
    if: startsWith(github.ref, 'refs/tags/wms-print-v')
    needs: [macos-package, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: WMS-Print-*
          path: release-assets
          merge-multiple: true
      - name: Prepare public installation instruction and checksums
        run: |
          cp tools/print-agent/README.md release-assets/WMS-Print-Installation.md
          (cd release-assets && sha256sum WMS-Print-Setup-Windows-x64.exe WMS-Print-macOS.zip > WMS-Print-SHA256SUMS.txt)
      - name: Publish public WMS Print release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF
          WMS Print packages built from source commit \`${SOURCE_COMMIT}\`.

          Download the Windows x64 installer or macOS arm64 ZIP below. Verify the adjacent \`.sha256\` file before installation; the same source commit is recorded in \`build.json\` inside each package.

          \`WMS-Print-Installation.md\` describes one-time setup, the supported platform matrix, autostart, and the remaining physical-printer checks.
          EOF
          python tools/print-agent/publish_release.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --assets-dir release-assets \
            --notes-file release-notes.md
