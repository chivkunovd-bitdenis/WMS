name: WMS-686 contract and mockup
# Целевой прогон контракта WMS-686 до продуктовой реализации: тесты существующего
# поведения обязаны быть зелёными, тесты нового поведения — падать только на
# проверке (assertion) с записанной причиной; макет обязан собираться.
on:
  push:
    branches: [claude/task-z2itwj, 'codex/wms686-**']
    paths:
      - .github/workflows/wms686-contract.yml
      - backend/tests/test_wms686_fbo_kiz_contract.py
      - frontend/src/screens/ff/unload-pick/FfUnloadPickPage.wms686.dom.test.tsx
      - frontend/src/screens/ff/FfSuppliesShipmentsPage.wms686.dom.test.tsx
      - docs/mockups/WMS-686/**
      - docs/requirements/WMS-686.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wms686-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_686
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_test_686"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e ".[dev]" asyncpg==0.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend helpers for backend HTTP contract tests
        run: npm ci --prefix ../frontend
      - name: Lint and types of the contract file
        run: |
          ruff check tests/test_wms686_fbo_kiz_contract.py
          mypy tests/test_wms686_fbo_kiz_contract.py
      - name: Contract on SQLite and existing-behaviour references (RED is recorded, not hidden)
        run: |
          mkdir -p "$RUNNER_TEMP/wms686"
          set +e
          pytest -n 0 -q tests/test_wms686_fbo_kiz_contract.py \
            "tests/test_wms632_fbo_reserve_model.py::test_pick_and_box_only_move_location_and_keep_reserve" \
            "tests/test_wms632_fbo_reserve_model.py::test_complete_writes_off_fact_once_and_releases_reserve" \
            "tests/test_wms679_wb_fbw_export_contract.py::test_c1_c2_c3_c4_c6_wb_export_is_exact_string_xlsx_from_existing_boxes" \
            --junitxml="$RUNNER_TEMP/wms686/backend.xml"
          echo "pytest exit $?"
      - name: Concurrency cases C50 and C51 on isolated PostgreSQL
        env:
          WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_686
        run: |
          set +e
          pytest -n 0 -q -m postgresql_concurrency tests/test_wms686_fbo_kiz_contract.py --junitxml="$RUNNER_TEMP/wms686/backend-pg.xml"
          echo "pytest exit $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms686-backend-${{ github.sha }}
          path: ${{ runner.temp }}/wms686
          if-no-files-found: error
          retention-days: 14

  frontend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (contract tests must compile on current product code)
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: DOM contract (RED is recorded, not hidden)
        run: |
          mkdir -p "$RUNNER_TEMP/wms686"
          set +e
          npx vitest run src/screens/ff/unload-pick/FfUnloadPickPage.wms686.dom.test.tsx src/screens/ff/FfSuppliesShipmentsPage.wms686.dom.test.tsx \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/wms686/frontend.json"
          echo "vitest exit $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms686-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/wms686
          if-no-files-found: error
          retention-days: 14

  mockup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing frontend dependencies
        run: |
          npm ci --prefix frontend
          ln -s frontend/node_modules node_modules
      - name: Preserved legacy mockup contract (guards/PROCESS_CONTRACTS.json, D13)
        run: node --test docs/mockups/WMS-686/model.test.ts
      - name: Mockup isolation and model checks (C33)
        run: node --test docs/mockups/WMS-686/fbo.test.ts
      - name: Typecheck and build the clickable mockup
        run: |
          frontend/node_modules/.bin/tsc --noEmit -p docs/mockups/WMS-686/tsconfig.json
          frontend/node_modules/.bin/vite build --config docs/mockups/WMS-686/vite.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: wms686-mockup-dist-${{ github.sha }}
          path: docs/mockups/WMS-686/dist
          if-no-files-found: error
          retention-days: 14

  report:
    needs: [backend-contract, frontend-contract]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wms686-backend-${{ github.sha }}
          path: ${{ runner.temp }}/wms686
      - uses: actions/download-artifact@v4
        with:
          name: wms686-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/wms686
      - name: GREEN must stay green; RED only on assertion; nothing broken
        run: |
          set +e
          python docs/mockups/WMS-686/ci/contract_report.py --root "$GITHUB_WORKSPACE" \
            --junit "backend=$RUNNER_TEMP/wms686/backend.xml" \
            --junit "backend=$RUNNER_TEMP/wms686/backend-pg.xml" \
            --vitest "$RUNNER_TEMP/wms686/frontend.json" \
            --expected docs/mockups/WMS-686/ci/expected_baseline.json \
            --out "$RUNNER_TEMP/wms686/summary.md"
          status=$?
          cat "$RUNNER_TEMP/wms686/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms686-contract-summary-${{ github.sha }}
          path: ${{ runner.temp }}/wms686/summary.md
          retention-days: 14
