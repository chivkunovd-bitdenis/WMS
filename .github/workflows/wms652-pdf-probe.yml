name: WMS-652 isolated frontend probe
on:
  push:
    branches: [codex/wms652-pdf-probe]
permissions:
  contents: read
jobs:
  frontend-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Verify WMS-517 attached CAdES auth profile
        run: npm run test:crypto-auth
      - name: Install Poppler and verify real PDF renderer
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          command -v pdfimages
          pdfimages -v
          echo "WMS_PRINT_CHROMIUM=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: All frontend tests including WMS-613 PDF pagination
        env:
          WMS_REQUIRE_PRINT_PAGINATION: "1"
        run: |
          test -n "$WMS_PRINT_CHROMIUM"
          test -x "$WMS_PRINT_CHROMIUM"
          command -v pdfimages
          npx vitest run
      - name: Build
        run: npm run build
