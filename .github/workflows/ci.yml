# Isolated observation branch only; never integrate this workflow into release.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warehouse-sc-sqlite-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Same backend shard dependencies
        working-directory: backend
        run: pip install -e ".[dev]" asyncpg==0.31.0
      - name: Same required Redis executable
        run: |
          if ! command -v redis-server; then
            sudo apt-get update -qq
            sudo apt-get install -y redis-server
          fi
          command -v redis-server
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Same frontend helper dependencies
        run: npm ci --prefix frontend
      - name: One unchanged SQLite warehouse SC test with metadata observation
        run: bash scripts/ci/warehouse-sc-diagnostic/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms652-warehouse-sc-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wms652-warehouse-sc-sqlite
          if-no-files-found: error
