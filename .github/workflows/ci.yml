name: CI

# Optional checks on PR only — does NOT block deploy (deploy.yml runs on push to main).
on:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce pipeline v2 control-plane scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci/check_pipeline_scope_guard.py
      - name: Validate WMS pipeline v2 contract
        run: python3 scripts/ci/check_pipeline_contract.py
      - name: Validate WMS pipeline v2 model policy
        run: python3 scripts/ci/check_pipeline_model_policy.py
      - name: Validate WMS pipeline v2 budget policy
        run: python3 scripts/ci/check_pipeline_budget_policy.py
      - name: Run WMS pipeline v2 metatests
        run: python3 scripts/ci/check_pipeline_metatests.py
      - name: Run WMS pipeline v2 policy metatests
        run: python3 scripts/ci/check_pipeline_policy_metatests.py
      - name: Run WMS pipeline v2 replay metatests
        run: python3 scripts/ci/check_pipeline_replay_metatests.py
      - name: Smoke-test WMS pipeline v2 wave-driver dry-run
        run: python3 scripts/ci/check_pipeline_wave_driver_smoke.py
      - name: Check pipeline evidence for raw secrets
        run: python3 scripts/ci/check_pipeline_evidence_secrets.py

  tc-coverage-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate TC automation coverage report
        run: python3 scripts/tc_automation_coverage.py
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc-automation-coverage
          path: docs/TC_AUTOMATION_COVERAGE.md

  pr-quality-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            product:
              - 'frontend/src/**'
              - 'frontend/tests-e2e/**'
              - 'backend/app/api/**'
              - 'backend/app/services/**'
            e2e_specs:
              - 'frontend/tests-e2e/**'
      - name: Paths filter result
        run: |
          echo "product=${{ steps.filter.outputs.product }}"
          echo "e2e_specs=${{ steps.filter.outputs.e2e_specs }}"
      - name: UI canon ratchet
        if: steps.filter.outputs.product == 'true'
        run: python3 scripts/ui/ui_guard.py
      - name: Changed screens use ui-kit
        if: steps.filter.outputs.product == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ui/ui_kit_usage_guard.py
      - name: PR body contains Product gate (AGENTS.md)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/ci/check_pr_product_gate.py
      - name: PR body contains Test coverage (AGENTS.md)
        if: steps.filter.outputs.product == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/ci/check_pr_test_coverage.py
      - name: Changed Playwright specs reference TC-ID
        if: steps.filter.outputs.e2e_specs == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/check_e2e_tc_mentions.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Pytest
        run: python3 ../scripts/testing/test_egress_guard.py -- bash -lc 'cd backend && pytest'

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps (uvicorn for Playwright)
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Run e2e
        env:
          CI: "1"
        run: python3 ../scripts/testing/test_egress_guard.py -- bash -lc 'cd frontend && npx playwright test'
