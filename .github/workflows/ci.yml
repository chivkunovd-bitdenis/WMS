name: CI

# Быстрый технический контроль на PR. Ничего, кроме сборки и тестов бэка,
# здесь не проверяется: продуктовый гейт, таблицы тест-кейсов и браузерные
# сценарии сняты 31.08.2026 — они стоили десять минут ожидания на каждой
# атомарной правке и не ловили ошибок, ради которых заводились.
on:
  pull_request:
  workflow_dispatch:

jobs:
  backlog:
    # Гейт бэклога: каждое изменение должно называть номер задачи из
    # docs/KANONICHESKIY_BACKLOG.md. Заведён 04.09.2026 после того, как выяснилось, что за два
    # месяца 97 задач владельца жили только в переписке, а постановка по
    # инвентаризации вообще исчезла из проекта при слиянии.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить ссылку на задачу
        run: ./scripts/ci/check-backlog-ref.sh "origin/${{ github.base_ref || 'etalon' }}"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_517
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_test_517"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend helpers for backend HTTP contract tests
        run: npm ci --prefix ../frontend
      - name: Pytest
        # -n auto раскладывает прогон по ядрам раннера. Вместе со сборкой схемы
        # один раз за прогон (tests/conftest.py) это увело полный набор
        # с 20 минут 38 секунд до 4 минут 48 секунд при том же составе тестов:
        # 1431 до, 1431 после, ни один не сменил исход.
        run: pytest -n auto
      - name: PostgreSQL locks and immutable migration guards
        env:
          WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517
        run: pytest -n 0 -m postgresql_concurrency tests/test_withdrawal_ledger.py tests/test_wb_order_price_snapshot.py tests/test_withdrawal_readiness.py
      - name: Fresh PostgreSQL migration chain and withdrawal rollback
        env:
          DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517_migrations
          JWT_SECRET_KEY: fixture-only-ci-migration-key-not-a-secret
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:fixture-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE wms_test_517_migrations'); c.close()"
          alembic upgrade head
          alembic downgrade 20260923_0517
          alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Verify WMS-517 attached CAdES auth profile
        run: npm run test:crypto-auth
      - name: Build
        run: npm run build
