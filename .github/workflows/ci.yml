# Isolated diagnostic override only. NEVER integrate into release/default branches.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  etalon-low-overhead-error-context-browser43:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require isolated exact dispatch identity, never a retry
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$DISPATCH_REF" = 'refs/heads/codex/wms652-etalon-low-overhead-error-context'
          test "$DISPATCH_SHA" = "$(git rev-parse HEAD)"
          test "$DISPATCH_ATTEMPT" = '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Original frontend dependencies and same Playwright Chrome141
        run: |
          npm ci --prefix frontend
          npm install --prefix "$RUNNER_TEMP/print-contract-tools" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/print-contract-tools/node_modules/playwright/cli.js" install --with-deps chromium
          node --input-type=module -e "import {chromium} from '$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs'; console.log('WMS672_CHROMIUM='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: One complete unchanged 43-case command, observation only
        run: bash scripts/ci/wms652-identity-diagnostic/run.sh
      - name: Preserve original strict result, identities, source proof and exact copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wms652-etalon-error-context-browser43-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wms652-identity-diagnostic
            ${{ runner.temp }}/release-print/critical-fbs/result.json
            ${{ runner.temp }}/release-print/critical-fbs/cdp-transport.json
            ${{ runner.temp }}/release-print/critical-fbs/error-context.json
            ${{ runner.temp }}/release-print/critical-fbs/chrome.log
            ${{ runner.temp }}/release-print/critical-fbs/vite.log
          if-no-files-found: error
          retention-days: 14
