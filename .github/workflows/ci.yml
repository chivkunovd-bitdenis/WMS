name: CI
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  all-pg-fixture-comparison:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_517
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d wms_test_517" --health-interval
          5s --health-timeout 3s --health-retries 20
      postgres662batch:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_662_batch
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: fixture-only
        ports:
        - 55466:5432
        options: --health-cmd "pg_isready -U wms_test -d wms_test_662_batch" --health-interval
          5s --health-timeout 3s --health-retries 20
      postgres662steady:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_662_steady
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: fixture-only
        ports:
        - 55468:5432
        options: --health-cmd "pg_isready -U wms_test -d wms_test_662_steady" --health-interval
          5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/pyproject.toml
    - name: Install deps
      run: 'python -m pip install -U pip

        pip install -e ".[dev]"

        '
    - name: Ruff
      run: python ../scripts/ci/pg-comparison/execute.py ruff
      id: ruff
      continue-on-error: true
      if: always()
    - name: Mypy
      run: python ../scripts/ci/pg-comparison/execute.py mypy
      id: mypy
      continue-on-error: true
      if: always()
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend helpers for backend HTTP contract tests
      run: npm ci --prefix ../frontend
    - name: Install exact native batch driver
      env:
        WMS_TEST_DATABASE_URL: postgresql+asyncpg://wms_test:fixture-only@127.0.0.1:55466/wms_test_662_batch
      run: pip install asyncpg==0.31.0
    - name: WMS-662 isolated batch lock order on real PostgreSQL / command01
      env:
        WMS_TEST_DATABASE_URL: postgresql+asyncpg://wms_test:fixture-only@127.0.0.1:55466/wms_test_662_batch
      run: python ../scripts/ci/pg-comparison/execute.py command01
      id: command01
      continue-on-error: true
      if: always()
    - name: WMS-662 isolated steady-state lock order on real PostgreSQL / command02
      env:
        WMS_TEST_DATABASE_URL: postgresql+asyncpg://wms_test:fixture-only@127.0.0.1:55468/wms_test_662_steady
      run: python ../scripts/ci/pg-comparison/execute.py command02
      id: command02
      continue-on-error: true
      if: always()
    - name: PostgreSQL locks and immutable migration guards / command03
      env:
        WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517
      run: python ../scripts/ci/pg-comparison/execute.py command03
      id: command03
      continue-on-error: true
      if: always()
    - name: PostgreSQL locks and immutable migration guards / command04
      env:
        WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517
      run: python ../scripts/ci/pg-comparison/execute.py command04
      id: command04
      continue-on-error: true
      if: always()
    - name: PostgreSQL locks and immutable migration guards / command05
      env:
        WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517
      run: python ../scripts/ci/pg-comparison/execute.py command05
      id: command05
      continue-on-error: true
      if: always()
    - name: Required PostgreSQL handoff cancellation documents and catalog contracts
        / command06
      run: python ../scripts/ci/pg-comparison/execute.py command06
      id: command06
      continue-on-error: true
      if: always()
    - name: WMS-675 real incident recovery on isolated PostgreSQL / command07
      env:
        WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@postgres:5432/wms_test_675_incident
      run: python ../scripts/ci/pg-comparison/execute.py command07
      id: command07
      continue-on-error: true
      if: always()
    - name: Fresh PostgreSQL migration chain and withdrawal rollback / command08
      env:
        DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517_migrations
        JWT_SECRET_KEY: fixture-only-ci-migration-key-not-a-secret
      run: python ../scripts/ci/pg-comparison/execute.py command08
      id: command08
      continue-on-error: true
      if: always()
    - name: Printer receipt persistence and unknown-outcome recovery / command09
      working-directory: .
      run: python ../scripts/ci/pg-comparison/execute.py command09
      id: command09
      continue-on-error: true
      if: always()
    - name: Preserve all native outcomes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: all-pg-fixture-comparison-${{ github.sha }}-${{ github.run_id }}-${{
          github.run_attempt }}
        path: '${{ runner.temp }}/pg-comparison

          ${{ runner.temp }}/release-postgres

          ${{ runner.temp }}/native-print.xml'
        retention-days: 14
    - name: Require every command actually passed
      if: always()
      run: python ../scripts/ci/pg-comparison/execute.py --verify
