name: CI

# PR checks plus an explicit full run on workflow_dispatch. Production deployment
# is a separate manual workflow (deploy.yml).
on:
  pull_request:
  workflow_dispatch:

jobs:
  change-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.filter.outputs.product }}
      e2e_specs: ${{ steps.filter.outputs.e2e_specs }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      process_checks: ${{ steps.filter.outputs.process_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            product:
              - 'frontend/src/**'
              - 'frontend/tests-e2e/**'
              - 'backend/app/**'
            e2e_specs:
              - 'frontend/tests-e2e/**'
            backend:
              - 'backend/**'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/run_fbs_fullstack_e2e.sh'
              - 'docker-compose.yml'
            process_checks:
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/process-integrity.yml'

  tc-coverage-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate TC automation coverage report
        run: python3 scripts/tc_automation_coverage.py
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc-automation-coverage
          path: docs/TC_AUTOMATION_COVERAGE.md

  pr-quality-contracts:
    if: always() && github.event_name == 'pull_request'
    needs: change-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Paths filter result
        run: |
          echo "product=${{ needs.change-scope.outputs.product }}"
          echo "e2e_specs=${{ needs.change-scope.outputs.e2e_specs }}"
          echo "backend=${{ needs.change-scope.outputs.backend }}"
          echo "e2e=${{ needs.change-scope.outputs.e2e }}"
      - name: PR body contains Product gate (AGENTS.md)
        if: needs.change-scope.result != 'success' || needs.change-scope.outputs.product == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/ci/check_pr_product_gate.py
      - name: PR body contains Test coverage (AGENTS.md)
        if: needs.change-scope.result != 'success' || needs.change-scope.outputs.product == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/ci/check_pr_test_coverage.py
      - name: Changed Playwright specs reference TC-ID
        if: needs.change-scope.result != 'success' || needs.change-scope.outputs.e2e_specs == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/check_e2e_tc_mentions.py

  process-checks:
    needs: change-scope
    if: always() && (github.event_name != 'pull_request' || needs.change-scope.result != 'success' || needs.change-scope.outputs.process_checks == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Trusted process checker unit tests
        run: >-
          python3 -m unittest
          scripts.ci.tests.test_trusted_process_check
          scripts.ci.tests.test_trusted_process_artifact
          scripts.ci.tests.test_ci_scope

  backend:
    needs: change-scope
    if: always() && (github.event_name != 'pull_request' || needs.change-scope.result != 'success' || needs.change-scope.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Pytest
        run: pytest

  e2e:
    needs: change-scope
    if: always() && (github.event_name != 'pull_request' || needs.change-scope.result != 'success' || needs.change-scope.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps (uvicorn for Playwright)
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Run e2e
        env:
          CI: "1"
        run: npx playwright test
