# Diagnostic branch only. Never integrate into release or default branches.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realqr-lifecycle-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install exact original frontend and Linux Chrome141
        run: |
          npm ci --prefix frontend
          npm install --prefix "$RUNNER_TEMP/print-contract-tools" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/print-contract-tools/node_modules/playwright/cli.js" install --with-deps chromium
          node --input-type=module -e "import {chromium} from '$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs'; console.log('WMS672_CHROMIUM='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Frozen selected remount case and separate native transport controls
        run: bash scripts/ci/wms652-realqr-diagnostic/run.sh
      - name: Preserve raw identity and lifecycle observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wms652-realqr-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wms652-realqr-lifecycle
          if-no-files-found: error
