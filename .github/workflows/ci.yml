# Diagnostic branch only: no pull_request/push, release proof, or publication.
name: CI
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Diagnostic source baseline (identity only)
        required: true
        type: string
permissions:
  contents: read
jobs:
  c5-raster-resource-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install original frontend and Chrome141 harness dependencies
        run: |
          npm ci --prefix frontend
          npm install --prefix "$RUNNER_TEMP/print-contract-tools" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/print-contract-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node --input-type=module -e "import {chromium} from '$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs'; console.log('WMS672_CHROMIUM='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Frozen3+2+7 and unchanged full C5 with bounded engine trace
        run: bash scripts/ci/wms672-c5-diagnostic/run.sh
      - name: Save raw diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wms672-c5-raster-resource-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c5-raster-resource-comparison
          if-no-files-found: error
