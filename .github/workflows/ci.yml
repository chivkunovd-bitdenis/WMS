# Isolated WMS-607 packaging only. Never merge this override into WMS release/main.
name: CI
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact independently accepted WMS-607 source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  mac-direct-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Require isolated dispatch and exact full source identity
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$DISPATCH_REF" = refs/heads/codex/wms607-direct-updater-mac-package-20261007
          test "$DISPATCH_ATTEMPT" = 1
          [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record actual source and architecture before all native checks
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
          HARNESS_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p "$RUNNER_TEMP/wms607-package"
          git rev-parse HEAD > "$RUNNER_TEMP/wms607-package/source.txt"
          printf '%s\n' "$HARNESS_SHA" > "$RUNNER_TEMP/wms607-package/harness.txt"
          uname -a > "$RUNNER_TEMP/wms607-package/environment.txt"
          python3 --version >> "$RUNNER_TEMP/wms607-package/environment.txt"
          swiftc --version >> "$RUNNER_TEMP/wms607-package/environment.txt"
      - name: Require filled accepted WMS-607 requirements from the complete source checkout
        run: |
          git merge-base --is-ancestor 49da13fd2a0d22f207818248f274cf5ff400e39f HEAD
          python3 -B scripts/ci/check_task_documents.py 49da13fd2a0d22f207818248f274cf5ff400e39f > "$RUNNER_TEMP/wms607-package/documents.log" 2>&1
      - name: Frozen updater ten cases including actual native journal
        run: |
          export WMS607_UPDATER_EVIDENCE_DIR="$RUNNER_TEMP/wms607-package/updater"
          python3 -B docs/evidence/WMS-607/updater-test-contract-20261007/run-contract.py --report "$RUNNER_TEMP/wms607-package/updater.xml" > "$RUNNER_TEMP/wms607-package/updater.log" 2>&1
      - name: Frozen rollback four cases
        run: |
          python3 -B tools/print-agent/test_macos_direct_updater_stop_contract.py --report "$RUNNER_TEMP/wms607-package/stop.xml" > "$RUNNER_TEMP/wms607-package/stop.log" 2>&1
      - name: Preserved nineteen native HTTP resolver and print cases
        run: |
          export WMS607_HTTP_EVIDENCE_DIR="$RUNNER_TEMP/wms607-package/http"
          python3 -B docs/evidence/WMS-607/updater-implementation-20261007/run-existing.py --report "$RUNNER_TEMP/wms607-package/existing.xml" > "$RUNNER_TEMP/wms607-package/existing.log" 2>&1
      - name: Require exact actual executed identities without skips or errors
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          source = Path('docs/evidence/WMS-607/updater-stop-fix-20261007')
          actual = Path(os.environ['RUNNER_TEMP']) / 'wms607-package'
          for report, baseline, expected in [('updater.xml','updater.xml',10),('stop.xml','green.xml',4),('existing.xml','existing.xml',19)]:
              def ids(path):
                  root = ET.parse(path).getroot()
                  assert not list(root.iter('failure')) and not list(root.iter('error')) and not list(root.iter('skipped')), path
                  rows = [f"{case.get('classname')}::{case.get('name')}" for case in root.iter('testcase')]
                  assert len(rows) == expected and len(set(rows)) == expected, path
                  return set(rows)
              assert ids(actual / report) == ids(source / baseline), report
          PYCODE
      - name: Original native Direct console builder and unpacked self-test
        run: |
          python3 -B tools/print-agent/build_console.py > "$RUNNER_TEMP/wms607-package/build.log" 2>&1
          tools/print-agent/dist-console/wms-print/wms-print --self-test > "$RUNNER_TEMP/wms607-package/self-test.log" 2>&1
      - name: Verify archive provenance and source remains unchanged
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          package = Path('tools/print-agent/dist-console/wms-print')
          data = json.loads((package/'build.json').read_text())
          assert data['source_commit'] == os.environ['REQUESTED_SOURCE']
          assert data['architecture'] == os.environ['EXPECTED_ARCH'] and data['platform'] == 'darwin'
          assert data['runtime'] == 'direct' and data['console'] is True and data['physical_print_verified'] is False
          assert subprocess.check_output(['lipo','-archs',str(package/'wms-print')], text=True).strip() == os.environ['EXPECTED_ARCH']
          subprocess.run(['codesign','--verify','--strict',str(package/'wms-print')],check=True)
          archives = list(Path('tools/print-agent/dist-console').glob('*.zip'))
          assert len(archives) == 1
          archive = archives[0]
          with zipfile.ZipFile(archive) as stream:
              assert json.loads(stream.read('wms-print/build.json')) == data
              assert stream.read('wms-print/update_macos_direct.sh') == Path('tools/print-agent/update_macos_direct.sh').read_bytes()
          record = {'archive':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'size':archive.stat().st_size,'build':data}
          (Path(os.environ['RUNNER_TEMP'])/'wms607-package'/'archive.json').write_text(json.dumps(record,indent=2)+'\n')
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['REQUESTED_SOURCE']
          PYCODE
      - name: Preserve exact native archives and all actual raw checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WMS607-Direct-${{ matrix.architecture }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/print-agent/dist-console/*.zip
            ${{ runner.temp }}/wms607-package
          if-no-files-found: error
          retention-days: 14
