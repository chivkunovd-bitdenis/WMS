name: CI

# Technical checks run both before merge and on the exact etalon commit.
on:
  pull_request:
  push:
    branches: [etalon]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Earlier trusted commit SHA (40 hex characters); never HEAD"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/etalon' }}

jobs:
  baseline:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve trusted comparison baseline
        id: base
        run: python scripts/ci/resolve_ci_base.py

  backlog:
    timeout-minutes: 5
    needs: baseline
    # Гейт бэклога: каждое изменение должно называть номер задачи из
    # docs/KANONICHESKIY_BACKLOG.md. Заведён 04.09.2026 после того, как выяснилось, что за два
    # месяца 97 задач владельца жили только в переписке, а постановка по
    # инвентаризации вообще исчезла из проекта при слиянии.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить ссылку на задачу
        env:
          BASE_SHA: ${{ needs.baseline.outputs.base_sha }}
        run: |
          ./scripts/ci/check-backlog-ref.sh "$BASE_SHA"
          python scripts/ci/check_task_documents.py "$BASE_SHA"

  backend-checks:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_517
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_test_517"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres662batch:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_662_batch
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 55466:5432
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test_662_batch"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres662steady:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test_662_steady
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 55468:5432
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test_662_steady"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend helpers for backend HTTP contract tests
        run: npm ci --prefix ../frontend
      - name: WMS-662 isolated batch lock order on real PostgreSQL
        env:
          WMS_TEST_DATABASE_URL: postgresql+asyncpg://wms_test:fixture-only@127.0.0.1:55466/wms_test_662_batch
        run: |
          pip install asyncpg==0.31.0
          mkdir -p "$RUNNER_TEMP/release-postgres"
          pytest -n 0 -q -s tests/test_wms662_batch_handoff_lock_order.py --junitxml="$RUNNER_TEMP/release-postgres/662-batch.xml"
      - name: WMS-662 isolated steady-state lock order on real PostgreSQL
        env:
          WMS_TEST_DATABASE_URL: postgresql+asyncpg://wms_test:fixture-only@127.0.0.1:55468/wms_test_662_steady
        run: pytest -n 0 -q -s tests/test_wms662_batch_handoff_steady_state.py
      - name: PostgreSQL locks and immutable migration guards
        env:
          WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517
        run: |
          pytest -n 0 -m postgresql_concurrency tests/test_withdrawal_ledger.py tests/test_wb_order_price_snapshot.py tests/test_withdrawal_readiness.py --junitxml="$RUNNER_TEMP/release-postgres/517-withdrawal.xml"
          pytest -n 0 tests/test_wms659_bulk_inbound_boxes.py::test_wms659_c7_same_mutation_is_concurrent_safe
          pytest -n 0 tests/test_wms537_draft_supply_stickers.py::test_concurrent_add_of_the_same_order_to_a_draft_supply
      - name: WMS-654 migration and both concurrent modes on isolated PostgreSQL
        env:
          WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_654_combined
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:fixture-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE wms_test_654_combined'); c.close()"
          pytest -n 0 -q tests/test_wms654_migration.py::test_c8_migration_preserves_legacy_rows_and_new_list_coordinates tests/test_wms654_cells.py::test_c4_postgresql_concurrent_requests_have_one_winner --junitxml="$RUNNER_TEMP/release-postgres/654.xml"
      - name: WMS-658 nine identity worker races on isolated PostgreSQL
        env:
          WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_658_identity
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:fixture-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE wms_test_658_identity'); c.close()"
          pytest -n 0 -q tests/test_wms658_normalized_identity_regression.py::test_postgresql_workers_share_one_code_pool_and_link_for_identity_variants --junitxml="$RUNNER_TEMP/release-postgres/658.xml"
      - name: WMS-681 two-worker QR checkpoint recovery on isolated PostgreSQL
        env:
          WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_681_recovery
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:fixture-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE wms_test_681_recovery'); c.close()"
          pytest -n 0 -q tests/test_wms681_postgres_recovery.py::test_wms681_postgres_two_workers_recover_one_group_across_qr_checkpoint --junitxml="$RUNNER_TEMP/release-postgres/681.xml"
      - name: Required PostgreSQL handoff cancellation documents and catalog contracts
        run: bash ../scripts/ci/run_release_postgres.sh
      - name: WMS-675 real incident recovery on isolated PostgreSQL
        env:
          WMS_TEST_DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@postgres:5432/wms_test_675_incident
        run: |
          # Keep the frozen Docker-aware database identity guard and bind the
          # service alias only to this runner's published loopback port.
          echo '127.0.0.1 postgres' | sudo tee -a /etc/hosts
          python -c "import socket; assert set(socket.gethostbyname_ex('postgres')[2]) == {'127.0.0.1'}"
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:fixture-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE wms_test_675_incident'); c.close()"
          pytest -n 0 -q -s tests/test_wms675_recovery_scenario.py --junitxml="$RUNNER_TEMP/release-postgres/675.xml"
      - name: Fresh PostgreSQL migration chain and withdrawal rollback
        env:
          DATABASE_URL: postgresql+psycopg_async://postgres:fixture-only@127.0.0.1:5432/wms_test_517_migrations
          JWT_SECRET_KEY: fixture-only-ci-migration-key-not-a-secret
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:fixture-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE wms_test_517_migrations'); c.close()"
          alembic upgrade head
          alembic downgrade 20260923_0517
          alembic upgrade head
      - name: Printer receipt persistence and unknown-outcome recovery
        working-directory: .
        run: python -m pytest -q tools/print-agent/test_wms_print_direct.py tools/print-agent/test_wms_print_runtime.py -k 'not test_windows_cmd_synthetic_queue_receipt' --junitxml="$RUNNER_TEMP/native-print.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-postgres
            ${{ runner.temp }}/native-print.xml
          retention-days: 14

  backend-shards:
    name: backend-shard-${{ matrix.index }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install full backend dependencies
        run: pip install -e ".[dev]" asyncpg==0.31.0
      - name: Ensure required Redis integration executable
        run: |
          if ! command -v redis-server; then
            sudo apt-get update -qq
            sudo apt-get install -y redis-server
          fi
          command -v redis-server
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend helpers for backend HTTP contract tests
        run: npm ci --prefix ../frontend
      - name: Full collection and deterministic backend half
        # The two isolated WMS-662 files still run in backend-checks against PG.
        # All remaining node IDs execute exactly once across these two jobs.
        run: >-
          python ../scripts/ci/backend_shards.py run
          --index ${{ matrix.index }} --output "$RUNNER_TEMP/backend-shard"
          -- -n auto
          --ignore=tests/test_wms662_batch_handoff_lock_order.py
          --ignore=tests/test_wms662_batch_handoff_steady_state.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-shard-${{ matrix.index }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-shard
          if-no-files-found: error
          retention-days: 14

  backend:
    # Keep the existing required name. Failed/skipped shards or PG/lint cannot pass.
    needs: [backend-checks, backend-shards]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require every backend producer to succeed
        env:
          CHECKS_RESULT: ${{ needs.backend-checks.result }}
          SHARDS_RESULT: ${{ needs.backend-shards.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$SHARDS_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          name: backend-checks-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-contracts
      - uses: actions/download-artifact@v4
        with:
          name: backend-shard-0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-shards/0
      - uses: actions/download-artifact@v4
        with:
          name: backend-shard-1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-shards/1
      - name: Verify full coverage and merge original JUnit outcomes
        run: >-
          python scripts/ci/backend_shards.py merge
          --shards "$RUNNER_TEMP/backend-shards/0" "$RUNNER_TEMP/backend-shards/1"
          --output "$RUNNER_TEMP/backend-contracts/backend-all.xml"
          --policy guards/PROCESS_CONTRACTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-contracts
          if-no-files-found: error
          retention-days: 14

  print-regressions:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated browser and PDF tools
        run: |
          npm ci --prefix frontend
          npm install --prefix "$RUNNER_TEMP/print-contract-tools" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/print-contract-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node --input-type=module -e "import {chromium} from '$RUNNER_TEMP/print-contract-tools/node_modules/playwright/index.mjs'; console.log('WMS672_CHROMIUM='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Required accepted native print error peer drain and raster contracts
        run: |
          mkdir -p "$RUNNER_TEMP/release-print"
          node --test --test-reporter=tap frontend/tests-e2e/wms672-native-errors.test.mjs > "$RUNNER_TEMP/release-print/672-native-errors.tap"
          node --test --test-reporter=tap frontend/tests-e2e/wms672-peer-drain.test.mjs > "$RUNNER_TEMP/release-print/672-peer-drain.tap"
          node --test --test-reporter=tap frontend/tests-e2e/wms672-raster-resource.test.mjs > "$RUNNER_TEMP/release-print/672-raster-resource.tap"
          node --test --test-reporter=tap frontend/tests-e2e/wms652-cdp-cancellation.test.mjs > "$RUNNER_TEMP/release-print/wms652-cdp-cancellation.tap"
      - name: Required box-label browser contracts and actual picking-list PDFs
        run: bash scripts/ci/run_release_print.sh
      - name: Real QR input, continuous printing and selected-order buttons
        run: bash scripts/ci/run_critical_fbs_browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-print-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-print
          retention-days: 14

  frontend-build:
    # Frontend and print run in parallel; process-proof requires both.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: WMS-517 complete synthetic macOS helper contracts
        working-directory: .
        run: >-
          node --test --test-reporter=tap
          scripts/ops/tests/wms517-mac-dom.test.cjs
          scripts/ops/tests/wms517-mac-launcher.test.cjs
          scripts/ops/tests/wms517-sold-kiz-filter.test.cjs
          > "$RUNNER_TEMP/wms517-mac.tap"
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Verify WMS-517 attached CAdES auth profile
        run: npm run test:crypto-auth
      # Probe 37144084796: minimal HTML hung in CfT but printed in system Chrome.
      # The probe does not distinguish browser version from distribution effects.
      - name: Install Poppler and verify real PDF renderer
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          command -v pdfimages
          pdfimages -v
          echo "WMS_PRINT_CHROMIUM=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: All frontend tests including WMS-613 PDF pagination
        env:
          WMS_REQUIRE_PRINT_PAGINATION: "1"
        run: |
          test -n "$WMS_PRINT_CHROMIUM"
          test -x "$WMS_PRINT_CHROMIUM"
          command -v pdfimages
          npx vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/frontend-all.json"
      - name: WMS-672 frozen cross-realm C5a decode contract
        run: npx vitest run --config tests-e2e/wms672-dom.config.ts -t 'C5a 33 labels' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/wms672-c5a.json"
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontend-all.json
            ${{ runner.temp }}/wms672-c5a.json
            ${{ runner.temp }}/wms517-mac.tap
          retention-days: 14

  wms686-mockup:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing frontend dependencies
        run: |
          npm ci --prefix frontend
          ln -s frontend/node_modules node_modules
      - name: WMS-686 frozen model and isolation contract
        run: node --test --test-reporter=tap docs/mockups/WMS-686/model.test.ts > "$RUNNER_TEMP/wms686-model.tap"
      - name: WMS-686 demo typecheck and build
        run: |
          frontend/node_modules/.bin/tsc --noEmit -p docs/mockups/WMS-686/tsconfig.json
          frontend/node_modules/.bin/vite build --config docs/mockups/WMS-686/vite.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms686-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wms686-model.tap
          if-no-files-found: error
          retention-days: 14

  guards:
    timeout-minutes: 10
    name: охрана
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install infrastructure test dependencies
        run: python -m pip install pytest pytest-xdist
      - name: Verify whole candidate against the accepted product reference
        run: python scripts/ci/product_scope.py --root . --trusted-ref 7dbce79566246f7467bf1b7c84efa8cbe8f1cd9b
      - name: Infrastructure tests (not business guards)
        run: |
          python -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
          python -m unittest discover -s scripts/ci -p 'test_check_task_documents.py' -v
      - name: Execute all product-scope contracts and persist receipt
        run: |
          python -m pytest -q scripts/ci/tests/test_product_scope.py --junitxml="$RUNNER_TEMP/product-scope.xml"
          python -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"product-scope-receipt.json").write_text(json.dumps(dict(version=1,sha=os.environ["GITHUB_SHA"],run_id=int(os.environ["GITHUB_RUN_ID"]),run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),report="product-scope.xml"))+"\n")'
      - name: Persist exact full-backend shard infrastructure cases
        run: >-
          python -m pytest -q scripts/ci/tests/test_backend_shards.py
          scripts/ci/tests/test_backend_shard_failclosed.py
          scripts/ci/tests/test_ci_release_additions.py
          scripts/ci/tests/test_backend_shard_redis_setup.py
          scripts/ci/tests/test_promote_guards.py
          scripts/ci/tests/test_process_contracts.py
          scripts/ci/tests/test_reviewed_process_upgrade.py
          scripts/ci/tests/test_process_deploy_gate.py
          scripts/ci/tests/test_server_process_gate.py
          scripts/ci/tests/test_retain_web_assets.py
          --junitxml="$RUNNER_TEMP/ci-shards.xml"
      - name: WMS-687 strict reviewed correction compatibility
        run: python -m pytest -q scripts/ci/test_check_task_documents.py --junitxml="$RUNNER_TEMP/docgate-687.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/product-scope.xml
            ${{ runner.temp }}/product-scope-receipt.json
            ${{ runner.temp }}/ci-shards.xml
            ${{ runner.temp }}/docgate-687.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify against the checker and manifest from trusted BASE
        id: integrity
        env:
          BASE_SHA: ${{ needs.baseline.outputs.base_sha }}
        run: |
          CHECKER="$RUNNER_TEMP/check_regression_guards.py"
          if git cat-file -e "$BASE_SHA:scripts/ci/check_regression_guards.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/check_regression_guards.py" > "$CHECKER"
            python "$CHECKER" --root "$GITHUB_WORKSPACE" --base "$BASE_SHA"
          else
            echo "Bootstrap only: trusted BASE has no checker; no business guard protection claimed."
            python scripts/ci/check_regression_guards.py --base "$BASE_SHA" --allow-bootstrap
          fi
      - name: Preserve accepted process tests, fixtures and execution commands
        env:
          BASE_SHA: ${{ needs.baseline.outputs.base_sha }}
        run: |
          set -euo pipefail
          TRUSTED="$RUNNER_TEMP/trusted-process/scripts/ci"
          mkdir -p "$TRUSTED"
          git show origin/main:scripts/ci/trusted_process_check.py > "$TRUSTED/trusted_process_check.py"
          git show origin/main:scripts/ci/process_bootstrap.json > "$TRUSTED/process_bootstrap.json"
          PROTECTED_REF=$(python - "$TRUSTED/trusted_process_check.py" "$BASE_SHA" <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('trusted_anchor', sys.argv[1])
          anchor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(anchor)
          pin = anchor.load_approved_bootstrap()
          print(pin['source_sha'] if pin and pin['base_sha'] == sys.argv[2] else sys.argv[2])
          PY
          )
          git show "$PROTECTED_REF:scripts/ci/process_contracts.py" > "$TRUSTED/process_contracts.py"
          UPGRADE_ARGS=()
          if [ "$PROTECTED_REF" != "$BASE_SHA" ]; then UPGRADE_ARGS=(--reviewed-upgrade); fi
          python "$TRUSTED/process_contracts.py" --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" "${UPGRADE_ARGS[@]}"
      - name: Install backend guard dependencies
        if: steps.integrity.outputs.backend_tests != '0'
        run: pip install -e './backend[dev]'
      - name: Approved backend guards
        if: steps.integrity.outputs.backend_tests != '0'
        working-directory: backend
        run: pytest -n auto tests/guards
      - uses: actions/setup-node@v4
        if: steps.integrity.outputs.frontend_tests != '0'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Approved frontend guards
        if: steps.integrity.outputs.frontend_tests != '0'
        working-directory: frontend
        run: |
          npm ci
          npx vitest run src/guards

  printer-windows:
    timeout-minutes: 10
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Persist receipt and recover unknown outcome on Windows
        run: python -m pytest -q tools/print-agent/test_wms_print_direct.py tools/print-agent/test_wms_print_runtime.py -k "not test_safe_synthetic_queue_runs_real_child_process_once and not test_actual_process_exit_after_spool_acceptance_recovers_without_second_submit" --junitxml=native-print-windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printer-windows-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-print-windows.xml
          retention-days: 14

  process-proof:
    # Required by the deployment verifier. Branch enforcement needs a separately
    # installed trusted anchor; this candidate workflow cannot protect itself.
    needs: [baseline, backend, frontend-build, guards, print-regressions, printer-windows, wms686-mockup]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: backend-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-proof
      - uses: actions/download-artifact@v4
        with:
          name: frontend-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-proof
      - uses: actions/download-artifact@v4
        with:
          name: printer-windows-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-proof
      - uses: actions/download-artifact@v4
        with:
          name: release-print-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-proof/print
      - uses: actions/download-artifact@v4
        with:
          name: guard-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-proof
      - uses: actions/download-artifact@v4
        with:
          name: wms686-executed-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-proof
      - name: Verify every required named case and bind evidence to this attempt
        env:
          BASE_SHA: ${{ needs.baseline.outputs.base_sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          TRUSTED="$RUNNER_TEMP/trusted-process/scripts/ci"
          mkdir -p "$TRUSTED"
          git show origin/main:scripts/ci/trusted_process_check.py > "$TRUSTED/trusted_process_check.py"
          git show origin/main:scripts/ci/process_bootstrap.json > "$TRUSTED/process_bootstrap.json"
          PROTECTED_REF=$(python - "$TRUSTED/trusted_process_check.py" "$BASE_SHA" <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('trusted_anchor', sys.argv[1])
          anchor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(anchor)
          pin = anchor.load_approved_bootstrap()
          print(pin['source_sha'] if pin and pin['base_sha'] == sys.argv[2] else sys.argv[2])
          PY
          )
          git show "$PROTECTED_REF:scripts/ci/process_contracts.py" > "$TRUSTED/process_contracts.py"
          UPGRADE_ARGS=()
          if [ "$PROTECTED_REF" != "$BASE_SHA" ]; then UPGRADE_ARGS=(--reviewed-upgrade); fi
          git show "$PROTECTED_REF:scripts/ci/build_process_proof.py" > "$TRUSTED/build_process_proof.py"
          python "$TRUSTED/build_process_proof.py" --root "$GITHUB_WORKSPACE" --reports "$RUNNER_TEMP/process-proof" --base "$BASE_SHA" "${UPGRADE_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: process-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-proof-final
          if-no-files-found: error
          retention-days: 30
