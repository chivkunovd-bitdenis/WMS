name: WMS663 C17 official public docs probe
on:
  push:
    branches: [codex/wms662-663-priority]
    paths:
      - .github/workflows/wms663-c17-official-docs.yml
      - docs/reviews/wms663-c17-official-20261006/probe.py
permissions:
  contents: read
jobs:
  official-public-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded alternate route from GitHub public network
        env:
          C17_OUTPUT: ${{ runner.temp }}/wms663-c17-official
        run: timeout 180s python3 docs/reviews/wms663-c17-official-20261006/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms663-c17-official-${{ github.sha }}
          path: ${{ runner.temp }}/wms663-c17-official
          retention-days: 14
