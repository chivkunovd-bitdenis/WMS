name: WMS-673 migrated WMS-657 contract proof

on:
  push:
    branches: [codex/wms672-673-analyst-20261006]
    paths:
      - .github/workflows/wms657-673-contract-proof.yml

permissions:
  contents: read

concurrency:
  group: wms657-673-contract-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrated-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WMS_SOURCE_SHA: '76f71776f403d0bdda07d521738281392e2b12ce'
    steps:
      - uses: actions/checkout@v4
      - name: Pin entire source tree independently of workflow runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wms657-proof"
          printf 'source=%s\nrunner=%s\n' "$WMS_SOURCE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/wms657-proof/source-pin.txt"
          cp .github/workflows/wms657-673-contract-proof.yml "$RUNNER_TEMP/wms657-proof/runner-workflow.yml"
          git fetch --no-tags origin "$WMS_SOURCE_SHA"
          git checkout --detach "$WMS_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$WMS_SOURCE_SHA"
          git ls-tree -r "$WMS_SOURCE_SHA" > "$RUNNER_TEMP/wms657-proof/source.manifest"
          git ls-tree -r HEAD > "$RUNNER_TEMP/wms657-proof/checkout.manifest"
          cmp "$RUNNER_TEMP/wms657-proof/source.manifest" "$RUNNER_TEMP/wms657-proof/checkout.manifest"
          git diff --exit-code "$WMS_SOURCE_SHA"
          sha256sum frontend/src/screens/v2/fbsPickingListPrint.wms657.test.ts frontend/src/screens/v2/fbsUx.ts frontend/vitest.config.ts frontend/package-lock.json > "$RUNNER_TEMP/wms657-proof/frozen-hashes-before.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install remote dependencies and verify real Chrome and Poppler
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend > "$RUNNER_TEMP/wms657-proof/npm-ci.log" 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils > "$RUNNER_TEMP/wms657-proof/poppler-install.log" 2>&1
          chrome_path=$(command -v google-chrome)
          echo "WMS_PRINT_CHROMIUM=$chrome_path" >> "$GITHUB_ENV"
          { uname -a; node --version; npm --version; "$chrome_path" --version; pdftotext -v; } > "$RUNNER_TEMP/wms657-proof/versions.log" 2>&1
      - name: Preserve raw outputs without changing test execution
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/wms657-proof/observe.cjs" <<'JS'
          // Observe original I/O only: never alter input, return values or cleanup.
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const path = require('node:path');
          const root = process.env.WMS657_PROOF_DIR;
          let sequence = 0;
          const prefix = () => path.join(root, `io-${process.pid}-${++sequence}`);
          const originalExec = cp.execFileSync;
          cp.execFileSync = function(command, args, options) {
            const result = originalExec.apply(this, arguments);
            if (args?.includes('--dump-dom') || (command === 'pdftotext' && args?.includes('-bbox-layout'))) {
              const target = prefix();
              fs.writeFileSync(target + '.command.json', JSON.stringify({command, args}, null, 2));
              fs.writeFileSync(target + '.raw.txt', result);
              const encoded = String(result).match(/data-wms657-geometry="([A-Za-z0-9+/=]+)"/)?.[1];
              if (encoded) fs.writeFileSync(target + '.geometry.json', Buffer.from(encoded, 'base64'));
            }
            return result;
          };
          const originalSpawn = cp.spawn;
          cp.spawn = function(command, args, options) {
            const child = originalSpawn.apply(this, arguments);
            if (args?.some(arg => arg.startsWith('--print-to-pdf='))) {
              const target = prefix();
              fs.writeFileSync(target + '.command.json', JSON.stringify({command, args}, null, 2));
              child.stdout?.on('data', data => fs.appendFileSync(target + '.stdout.log', data));
              child.stderr?.on('data', data => fs.appendFileSync(target + '.stderr.log', data));
              child.on('exit', (code, signal) => fs.writeFileSync(target + '.exit.json', JSON.stringify({code, signal})));
            }
            return child;
          };
          const originalRemove = fs.rmSync;
          fs.rmSync = function(target, options) {
            if (typeof target === 'string' && /^wms657-(geometry|pdf)-/.test(path.basename(target)) && fs.existsSync(target)) {
              const destination = path.join(root, path.basename(target));
              fs.mkdirSync(destination, {recursive: true});
              for (const entry of fs.readdirSync(target, {withFileTypes: true})) {
                if (entry.isFile()) fs.copyFileSync(path.join(target, entry.name), path.join(destination, entry.name));
              }
            }
            return originalRemove.apply(this, arguments);
          };
          require('node:module').syncBuiltinESMExports();
          JS
      - name: Run exact frozen C1-C6 including actual PDF and negative controls
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export WMS657_PROOF_DIR="$RUNNER_TEMP/wms657-proof"
          export NODE_OPTIONS="--require=$RUNNER_TEMP/wms657-proof/observe.cjs"
          cd frontend
          node node_modules/vitest/vitest.mjs run src/screens/v2/fbsPickingListPrint.wms657.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/wms657-proof/results.json" 2>&1 | tee "$RUNNER_TEMP/wms657-proof/tests.log"
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/wms657-proof/test-exit-code.txt"
          cd ..
          sha256sum frontend/src/screens/v2/fbsPickingListPrint.wms657.test.ts frontend/src/screens/v2/fbsUx.ts frontend/vitest.config.ts frontend/package-lock.json > "$RUNNER_TEMP/wms657-proof/frozen-hashes-after.txt"
          cmp "$RUNNER_TEMP/wms657-proof/frozen-hashes-before.txt" "$RUNNER_TEMP/wms657-proof/frozen-hashes-after.txt" || exit 2
          git diff --exit-code "$WMS_SOURCE_SHA" || exit 2
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms657-673-proof-${{ github.sha }}
          path: ${{ runner.temp }}/wms657-proof
          retention-days: 14
          if-no-files-found: error
