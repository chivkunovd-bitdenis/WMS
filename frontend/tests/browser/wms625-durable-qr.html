<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>WMS-625: QR после скана через WMS Print</title>
<style>body{font:16px system-ui;max-width:1000px;margin:40px auto;color:#182433}button{padding:10px;margin:6px 6px 6px 0}pre{white-space:pre-wrap;background:#eef2f6;padding:16px}img{width:116px;border:1px solid #aaa}label{display:block;margin:12px 0}input{padding:8px}</style>
<h1>WMS-625: QR после скана через WMS Print</h1>
<p>Изолированная проверка: настоящий механизм упаковки WB (WMS-631) и IndexedDB браузера; WMS API и WMS Print подменены. Принтера и рабочих заказов нет.</p>
<label>Штрихкод <input id="barcode" value="460000625"></label>
<button id="scan">Сканировать</button>
<button id="old">WMS Print старая (только POST /print)</button><button id="modern">WMS Print с журналом</button><button id="off">WMS Print выключена</button><button id="lost">Потерять ответ на следующий POST</button><button id="stop">Очередь остановлена</button><button id="resume">Очередь возобновлена</button>
<button id="reload">Перезагрузить страницу</button><button id="reset">Сбросить всё</button>
<pre id="result">Загрузка…</pre><img id="image" alt="Сохранённая в браузере этикетка">
<script type="module">
import { createPackingScanController, makePackingScanDeps } from '/src/screens/v2/fbsSequentialPacking.ts'
import { directQrHash, qrAttemptStore } from '/src/utils/durableDirectQr.ts'
const png = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aUY4AAAAASUVORK5CYII='
const $ = (id) => document.getElementById(id)
const fresh = () => ({ program: 'old', loseNext: false, queueStopped: false, selections: {}, started: [], jobs: {}, posts: [], packed: [] })
const read = () => JSON.parse(localStorage.getItem('wms625-fixture') || 'null') ?? fresh()
const save = (state) => localStorage.setItem('wms625-fixture', JSON.stringify(state))
const token = `x.${btoa(JSON.stringify({ sub: 'fixture-user', tenant_id: 'fixture-tenant' }))}.x`
const workspace = { supply: { id: 'fixture-supply', packaging_task_id: 'fixture-task' }, orders: [1, 2, 3].map((n) => ({ id: `order-${n}`, product: { id: 'product' }, pack: { status: 'pending' } })), boxes: [] }
let lastError = ''
const json = (value, status = 200) => new Response(JSON.stringify(value), { status, headers: { 'Content-Type': 'application/json' } })
window.fetch = async (url, init = {}) => {
  const state = read(); const path = String(url); const body = init.body ? JSON.parse(init.body) : {}
  const method = (init.method || 'GET').toUpperCase()
  if (path.startsWith('http://127.0.0.1:17843')) {
    const local = path.slice('http://127.0.0.1:17843'.length)
    if (state.program === 'off') throw new TypeError('fixture: WMS Print not running')
    if (state.program === 'old') {
      if (method !== 'POST' || local !== '/print') return json({}, 404)
      state.posts.push({ program: 'old', body: Object.keys(body) })
      const receipt = state.jobs[body.idempotencyKey]?.receipt ?? `old-queue-${state.posts.length}`
      state.jobs[body.idempotencyKey] = { receipt }
      const lose = state.loseNext; state.loseNext = false; save(state)
      if (lose) throw new TypeError('fixture: response lost')
      return json({ receipt })
    }
    if (local === '/health') return json({ app: 'WMS Print Direct', protocolVersion: 2 })
    if (method === 'POST' && local === '/print') {
      state.posts.push({ program: 'modern', body: Object.keys(body) })
      if (!state.jobs[body.idempotencyKey]) {
        const { imageDataUrl, protocolVersion, ...job } = body
        state.jobs[body.idempotencyKey] = { ...job, hash: await directQrHash(body), status: state.queueStopped ? 'stopped' : 'accepted', receipt: `queue-${state.posts.length}` }
      }
      const lose = state.loseNext; state.loseNext = false; save(state)
      if (lose) throw new TypeError('fixture: response lost')
      // An older browser (no protocolVersion) gets the answer after the queue accepted the job.
      return json(state.jobs[body.idempotencyKey], body.protocolVersion === 2 ? 202 : 200)
    }
    const key = decodeURIComponent(local.split('/jobs/')[1]?.split('/')[0] ?? '')
    return state.jobs[key] ? json(state.jobs[key]) : json({}, 404)
  }
  if (path.endsWith('/scan-auto-print')) {
    state.selections[body.idempotency_key] ||= Object.keys(state.selections).length + 1; save(state)
    const n = state.selections[body.idempotency_key]
    return json({ scan_id: `fixture-scan-${n}`, order_id: `order-${n}`, wb_order_id: 625000 + n, replayed: false, requires_honest_sign: false, binding_target: null, reprint_recovery: null, qr_asset: { id: 'fixture-qr', status: 'ready', preview_url: '/fixture-label.png' }, codes: [], printed_codes: [], shortage: 0, order_errors: [] })
  }
  if (path.endsWith('/fixture-label.png')) return new Response(Uint8Array.from(atob(png.split(',')[1]), (c) => c.charCodeAt(0)), { headers: { 'Content-Type': 'image/png' } })
  if (path.includes('/scan-auto-print/')) {
    const key = path.split('/scan-auto-print/')[1].split('/')[0]
    if (path.endsWith('/print-started') && !state.started.includes(key)) { state.started.push(key); save(state) }
    return json({ claimed: path.endsWith('/print-claim') && !state.started.includes(key), started: state.started.includes(key) })
  }
  if (path.endsWith('/fixture-task')) return json({ lines: [{ id: 'line', product_id: 'product' }] })
  if (path.endsWith('/pack')) { if (!state.packed.includes(body.order_id)) state.packed.push(body.order_id); save(state); return json({}) }
  throw new Error(`Unexpected fixture request ${path}`)
}
const deps = makePackingScanDeps(token, () => ({}), () => workspace, () => {}, () => {}, () => true, () => null,
  () => {}, () => {}, () => ({ printQr: true, printChz: false, reprintChz: false }))
const controller = createPackingScanController(deps)
async function show() {
  const state = read(); const n = Object.keys(state.selections).length
  let saved = null
  try { saved = n ? await qrAttemptStore.get(`fixture-scan-${n}`) : null } catch (error) { saved = { error: error.message } }
  $('result').textContent = JSON.stringify({
    program: state.program, selectedOrders: n, nativePosts: state.posts, packed: state.packed, started: state.started,
    pending: controller.view(), browserRecord: saved && !saved.error ? {
      key: saved.input.idempotencyKey, order: saved.input.context.orderId, barcode: saved.input.context.barcode, wbOrderId: saved.input.context.wbOrderId,
      size: `${saved.input.widthMm}×${saved.input.heightMm}`, exactPng: saved.input.imageDataUrl === png,
      dispatchStartedAt: Boolean(saved.dispatchStartedAt), result: saved.result?.status ?? null, legacyAccepted: Boolean(saved.legacyAcceptedAt),
    } : saved, error: lastError,
  }, null, 2)
  if (saved?.input) $('image').src = saved.input.imageDataUrl
}
$('scan').onclick = async () => { lastError = ''; try { await controller.scan($('barcode').value) } catch (error) { lastError = error.message } await show() }
for (const program of ['old', 'modern', 'off']) $(program).onclick = () => { const state = read(); state.program = program; save(state); show() }
$('lost').onclick = () => { const state = read(); state.loseNext = true; save(state); show() }
$('stop').onclick = () => { const state = read(); state.queueStopped = true; Object.values(state.jobs).forEach((job) => { if (job.status) job.status = 'stopped' }); save(state); show() }
$('resume').onclick = () => { const state = read(); state.queueStopped = false; Object.values(state.jobs).forEach((job) => { if (job.status) job.status = 'completed' }); save(state); show() }
$('reload').onclick = () => location.reload()
$('reset').onclick = async () => { localStorage.clear(); indexedDB.deleteDatabase('wms-direct-qr-v1'); location.reload() }
await show()
</script></html>
