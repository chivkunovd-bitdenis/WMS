<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>WMS-625: проверка сохранности QR</title>
<style>body{font:16px system-ui;max-width:1000px;margin:40px auto;color:#182433}button{padding:12px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;background:#eef2f6;padding:20px}img{width:116px;border:1px solid #aaa}label{display:block;margin:12px 0}input{padding:10px}</style>
<h1>WMS-625: проверка сохранности QR</h1>
<p>Изолированная проверка: настоящий контроллер массовой сборки и IndexedDB браузера, тестовые WMS API и очередь. Подключения к принтеру и рабочим заказам нет.</p>
<label>Штрихкод <input id="barcode" value="460000625"></label>
<button id="scan">Сканировать</button><button id="offline">Native недоступен</button><button id="lost">Потерять ответ после приёма</button><button id="online">Восстановить native</button><button id="cancel">Отменить задание в очереди</button><button id="reprint">Явно перепечатать исходную этикетку</button><button id="size">Изменить размер настройки</button><button id="reload">Перезагрузить страницу</button>
<pre id="result">Загрузка…</pre><img id="image" alt="Исходная PNG этикетки">
<script type="module">
import { createPackingScanController, makePackingScanDeps } from '/src/screens/v2/fbsSequentialPacking.ts'
import { restoreDurableQr } from '/src/utils/durableDirectQr.ts'
const png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aUY4AAAAASUVORK5CYII='
const $ = id => document.getElementById(id)
const read = () => JSON.parse(localStorage.getItem('wms625-fixture') || '{"mode":"offline","selections":{},"jobs":{},"posts":0,"packed":[],"started":[]}')
const save = state => localStorage.setItem('wms625-fixture',JSON.stringify(state))
const token=`x.${btoa(JSON.stringify({sub:'fixture-user',tenant_id:'fixture-tenant'}))}.x`
const workspace={supply:{id:'fixture-supply',packaging_task_id:'fixture-task'},orders:[1,2,3].map(n=>({id:`order-${n}`,product:{id:'product'}})),boxes:[]}
let lastError=''
const json=(value,status=200)=>new Response(JSON.stringify(value),{status,headers:{'Content-Type':'application/json'}})
window.fetch=async (url,init={})=>{
 const state=read();const path=String(url);const body=init.body?JSON.parse(init.body):{}
 if(path.startsWith('http://127.0.0.1:17843')) {
  if(state.mode==='offline')throw new TypeError('test native offline')
  if(path.endsWith('/print')) {
   state.posts++
   const job=state.jobs[body.idempotencyKey] ||= {...body,hash:'a'.repeat(64),status:'accepted',receipt:`fixture-${state.posts}`}
   save(state)
   if(state.mode==='lost'){state.mode='online';save(state);throw new TypeError('test response lost')}
   return json(job,202)
  }
  const key=decodeURIComponent(path.split('/jobs/')[1].split('/')[0])
  return state.jobs[key]?json({...state.jobs[key],reprints:Object.values(state.jobs).filter(job=>job.parentKey===key)}):json({},404)
 }
 if(path.endsWith('/scan-auto-print')) {
  state.selections[body.idempotency_key] ||= Object.keys(state.selections).length+1;save(state)
  const n=state.selections[body.idempotency_key]
  return json({scan_id:`fixture-scan-${n}`,order_id:`order-${n}`,wb_order_id:625000+n,requires_honest_sign:false,binding_target:null,reprint_recovery:null,qr_asset:{preview_url:'/fixture-label.png'},codes:[],printed_codes:[],shortage:0,order_errors:[]})
 }
 if(path.endsWith('/fixture-label.png'))return new Response(Uint8Array.from(atob(png.split(',')[1]),c=>c.charCodeAt(0)),{headers:{'Content-Type':'image/png'}})
 if(path.endsWith('/print-claim')) {
  const key=path.split('/scans/')[1]?.split('/')[0] || path.split('/scan-auto-print/')[1]?.split('/')[0]
  return json({claimed:!state.started.includes(key),started:state.started.includes(key)})
 }
 if(path.endsWith('/print-started')){const key=path.split('/scans/')[1]?.split('/')[0] || path.split('/scan-auto-print/')[1]?.split('/')[0];state.started.push(key);save(state);return json({claimed:false,started:true})}
 if(path.endsWith('/fixture-task'))return json({lines:[{id:'line',product_id:'product'}]})
 if(path.endsWith('/pack')){if(!state.packed.includes(body.order_id))state.packed.push(body.order_id);save(state);return json({})}
 throw new Error(`Unexpected fixture request ${path}`)
}
const deps=makePackingScanDeps(token,()=>({}),()=>workspace,()=>{},()=>{})
const controller=createPackingScanController(deps)
async function show(){
 const state=read();const n=Object.keys(state.selections).length
 const context={tenantId:'fixture-tenant',userId:'fixture-user',supplyId:'fixture-supply',orderId:`order-${n}`,scanId:`fixture-scan-${n}`,barcode:'460000625',marketplace:'wildberries',wbOrderId:625000+n}
 const saved=n?await restoreDurableQr(`fixture-scan-${n}`,context):null
 $('result').textContent=JSON.stringify({native:state.mode,selectedOrders:n,printPosts:state.posts,packed:state.packed,active:controller.view(),savedKey:saved?.input.idempotencyKey,savedSize:saved?`${saved.input.widthMm}×${saved.input.heightMm}`:null,exactPng:saved?.input.imageDataUrl===png,result:saved?.result?.status,reprints:saved?.result?.reprints?.map(job=>({key:job.idempotencyKey,status:job.status,parent:job.parentKey})),error:lastError},null,2)
 if(saved)$('image').src=saved.input.imageDataUrl
}
$('scan').onclick=async()=>{lastError='';try{await controller.scan($('barcode').value)}catch(error){lastError=error.message}await show()}
for(const mode of ['offline','lost','online'])$(mode).onclick=()=>{const state=read();state.mode=mode;save(state);show()}
$('cancel').onclick=()=>{const state=read();Object.values(state.jobs).forEach(job=>job.status='canceled');save(state);show()}
$('reprint').onclick=()=>{const state=read();const key=`fixture-scan-${Object.keys(state.selections).length}`;const parent=state.jobs[key];if(parent){parent.hash='a'.repeat(64);const childKey=`${key}:explicit-reprint`;state.jobs[childKey]={...parent,idempotencyKey:childKey,parentKey:key,status:'accepted',receipt:`fixture-explicit-${++state.posts}`};save(state)}show()}
$('size').onclick=()=>{localStorage.setItem('wms.print.labelSizeId','70x120');show()}
$('reload').onclick=()=>location.reload()
await show()
</script></html>
